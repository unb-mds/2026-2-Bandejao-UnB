name: Backend CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - run: pip install -r requirements-dev.txt
    - run: ruff check .
    - run: ruff format --check .

  testes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - run: pip install -r requirements-dev.txt
    - run: pytest --cov=apps --cov-branch --cov-fail-under=70

  seguranca:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - run: pip install -r requirements-dev.txt
    - run: bandit -r apps config -lll
    - run: pip-audit -r requirements-dev.txt
    - run: pipx run --spec semgrep==1.184.0 semgrep scan --config p/python --config p/django --severity ERROR --error --metrics=off

  testes-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: senha-ci-descartavel
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: bandejao_ci
          # Como na VM (docker-compose.yml): a imagem cria o usuário da
          # aplicação com acesso total ao banco, e o db/init/10-usuarios.sh
          # reduz os privilégios (#209).
          MYSQL_USER: app_ci
          MYSQL_PASSWORD: senha-app-ci-descartavel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DJANGO_SECRET_KEY: chave-exclusiva-do-ci
      DJANGO_ALLOWED_HOSTS: localhost
      DB_ENGINE: mysql
      DB_NAME: bandejao_ci
      # O usuário restrito, e não o root: uma migration que precise de um
      # privilégio fora da lista do 10-usuarios.sh falha aqui, e não só no
      # deploy (#209).
      DB_USER: app_ci
      DB_PASSWORD: senha-app-ci-descartavel
      MYSQL_ROOT_PASSWORD: senha-ci-descartavel
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      # Sem DEBUG, o settings exige o endereço do PWA, o SMTP e o remetente
      # (BE-06, #96, BD-05), e só aceita o backend SMTP. Os passos com
      # manage.py rodam fora do pytest e não leem o pytest.ini, então os
      # valores dele vêm repetidos aqui. O SMTP é falso: nenhum passo envia
      # e-mail, e nos testes o pytest-django troca o MAILERS pelo de memória.
      URL_DO_PWA: http://localhost:5173
      EMAIL_HOST: smtp.teste.invalid
      EMAIL_HOST_USER: usuario-teste
      EMAIL_HOST_PASSWORD: senha-teste
      DEFAULT_FROM_EMAIL: nao-responda@bandejaounb.com.br

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-ci-mysql.txt

      - name: Instalar bibliotecas do MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      # O mesmo script da primeira subida da VM, rodado dentro do container do
      # serviço (ele usa o cliente mysql pelo socket, como na imagem). O
      # MYSQL_DATABASE, o MYSQL_USER e a senha de root já estão no ambiente
      # do container; o usuário da equipe só existe aqui.
      - name: Criar os usuários como em produção (db/init/10-usuarios.sh)
        run: |
          docker cp ../db/init/10-usuarios.sh "${{ job.services.mysql.id }}":/tmp/10-usuarios.sh
          docker exec \
            -e DB_EQUIPE_USER=equipe_ci \
            -e DB_EQUIPE_PASSWORD=senha-equipe-ci-descartavel \
            "${{ job.services.mysql.id }}" sh /tmp/10-usuarios.sh

      # O passo obrigatório do guia de deploy, aqui também: o usuário da
      # aplicação não pode ter ALL PRIVILEGES nem privilégio global.
      - name: Conferir as permissões do usuário da aplicação (SHOW GRANTS)
        env:
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: |
          permissoes=$(mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -N \
            -e "SHOW GRANTS FOR '$DB_USER'@'%'")
          echo "$permissoes"
          if echo "$permissoes" | grep -q "ALL PRIVILEGES"; then
            echo "::error::$DB_USER com ALL PRIVILEGES: o 10-usuarios.sh não reduziu os privilégios."
            exit 1
          fi
          if echo "$permissoes" | grep -v "GRANT USAGE" | grep -q " ON \*\.\* "; then
            echo "::error::$DB_USER com privilégio global (ON *.*)."
            exit 1
          fi
          echo "$permissoes" | grep -q "ON \`$DB_NAME\`" \
            || { echo "::error::$DB_USER sem privilégio no $DB_NAME."; exit 1; }

      # O pytest-django cria o banco test_<DB_NAME>. Ele recebe exatamente os
      # privilégios que o script deu ao banco da aplicação, copiados do SHOW
      # GRANTS, e não uma lista própria, que poderia ser maior que a de
      # produção. Só no CI: na VM não existe banco de teste.
      - name: Dar ao banco de teste os mesmos privilégios (test_${{ env.DB_NAME }})
        env:
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: |
          linha=$(mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -N \
            -e "SHOW GRANTS FOR '$DB_USER'@'%'" | grep "ON \`$DB_NAME\`")
          privilegios=$(echo "$linha" | sed -E 's/^GRANT (.*) ON .*/\1/')
          echo "Privilégios copiados: $privilegios"
          # O "_" é curinga no nome do banco do GRANT: escapado, vale só o
          # test_<DB_NAME>.
          banco_de_teste=$(echo "test_$DB_NAME" | sed 's/_/\\_/g')
          mysql -h "$DB_HOST" -P "$DB_PORT" -uroot \
            -e "GRANT $privilegios ON \`$banco_de_teste\`.* TO '$DB_USER'@'%'"

      - name: Instalar dependências Python
        run: python -m pip install -r requirements-ci-mysql.txt

      - name: Auditar dependências
        run: pip-audit -r requirements-ci-mysql.txt

      - name: Validar backend MySQL
        run: >-
          python manage.py shell -c
          "from django.db import connection; assert connection.vendor == 'mysql', f'Backend incorreto: {connection.vendor}'"

      - name: Conferir migrations pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migrations do zero
        run: python manage.py migrate --noinput

      # Sem DEBUG, como em produção. Os avisos de HSTS (deixado de fora de
      # propósito) e de SECURE_SSL_REDIRECT (o Caddy redireciona) não falham;
      # um erro, sim.
      - name: Conferir o settings de produção
        run: python manage.py check --deploy

      - name: Executar testes no MySQL
        id: testes_mysql
        run: python -m pytest -rs --cov=apps --cov-branch --cov-fail-under=70

      # Repete só os testes da BD-10 com `-s` para o EXPLAIN do MySQL ficar no
      # log (evidência do RNF01). A conferência dos índices já vale no passo
      # anterior; este passo só imprime o plano, mesmo quando ele falha. Não
      # roda se os testes nem começaram (instalação ou migrations com erro).
      - name: EXPLAIN dos índices (BD-10)
        if: ${{ !cancelled() && steps.testes_mysql.outcome != 'skipped' }}
        run: python -m pytest tests/test_indices_bd10.py -s -q --no-cov
