name: Backend mutação semanal

# Mutação na base inteira dos módulos críticos (BE-19, ADR 0013, decisão 6;
# Plano de Testes 5.4): pega o escore de quem não mexeu em módulo crítico
# recentemente, o que o job `mutacao` dos PRs não vê. É o relatório que a
# BE-18 anexa à issue.
#
# Separado do backend-ci.yml para não disparar lint, testes e testes-mysql
# toda semana sem motivo.
on:
  schedule:
    # Domingo às 06:00 UTC (03:00 em Brasília).
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Uma rodada de cada vez. A que está rodando não é cancelada: a base inteira
# leva horas, e a nova espera.
concurrency:
  group: backend-mutacao-semanal-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend
    # Com `shell: bash` explícito, o GitHub roda com `-eo pipefail`: uma falha
    # no meio de um pipe derruba o passo.
    shell: bash

jobs:
  # Um job por módulo crítico: a base inteira (5.240 mutantes, quase metade no
  # leitor) arrisca passar do limite de 6 horas de um job só.
  mutacao:
    name: mutacao (${{ matrix.modulo }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      # Um módulo abaixo da meta não interrompe os outros: o relatório sai
      # completo.
      fail-fast: false
      matrix:
        include:
          - modulo: cadastro
            artefato: cadastro
          - modulo: cardapio/leitor
            artefato: cardapio-leitor
          - modulo: cardapio
            artefato: cardapio
          - modulo: avaliacao
            artefato: avaliacao
          - modulo: fila
            artefato: fila
          - modulo: gamificacao
            artefato: gamificacao
    steps:
    - uses: actions/checkout@v5
      with:
        # Na rodada agendada, o workflow roda a partir da `main`, mas a base
        # que importa é a da `develop`, onde as mudanças entram primeiro. No
        # workflow_dispatch, vale a branch escolhida.
        ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - run: pip install -r requirements-dev.txt

    # O cardápio sem o leitor é a lista dos arquivos: "apps.cardapio.*" também
    # casaria com o leitor.
    - name: Curingas do módulo
      env:
        MODULO: ${{ matrix.modulo }}
      run: |
        python scripts/mutacao_incremental.py modulo "$MODULO" > alvos.txt
        # Sem curinga, o `mutmut run` sem argumentos mutaria todos os módulos.
        if [ ! -s alvos.txt ]; then
          echo "::error::Sem curingas para o módulo $MODULO."
          exit 1
        fi
        cat alvos.txt

    - name: Rodar o mutmut no módulo
      run: |
        mapfile -t alvos < alvos.txt
        set +e
        mutmut run --max-children 4 "${alvos[@]}" > mutmut.log 2>&1
        codigo=$?
        set -e
        # Tira as linhas da barra de progresso e deixa só a última.
        tr '\r' '\n' < mutmut.log | awk '
          /^[^ ]+ [0-9]+\/[0-9]+  / { progresso = $0; next }
          /^[^ ]+ [A-Z][A-Za-z ]*$/ { next }
          NF { print }
          END { if (progresso) print "Progresso final: " progresso }' | tail -n 100
        # Interrompido (tempo esgotado ou cancelamento), o mutmut imprime
        # "Stopping..." e sai com 0: o JSON seria de uma amostra do módulo.
        # Sem `^`: a mensagem cai na mesma linha física da barra de progresso,
        # depois de um \r.
        if grep -qF 'Stopping...' mutmut.log; then
          echo "::error::A rodada do mutmut no módulo foi interrompida."
          exit 1
        fi
        if [ "$codigo" -ne 0 ]; then
          echo "::error::O mutmut saiu com $codigo (log completo no artefato)."
          exit "$codigo"
        fi
        # Falha se algum mutante do módulo ficou "not checked" (rodada parcial
        # com saída 0): o JSON do mutmut não tem esse campo.
        mutmut results --all true > mutmut-results-todos.txt
        python scripts/mutacao_incremental.py conferir --depois-de-rodar alvos.txt mutmut-results-todos.txt
        mutmut export-cicd-stats
        # Sobreviventes e sem teste (sem os "not checked", que ficaram fora
        # desta rodada, e sem os mortos).
        grep -v -e ': not checked$' -e ': killed$' mutmut-results-todos.txt > mutmut-results.txt || true

    - name: Publicar o relatório do módulo
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: mutacao-${{ matrix.artefato }}
        path: |
          backend/mutmut.log
          backend/mutmut-results.txt
          backend/mutants/mutmut-cicd-stats.json
        if-no-files-found: warn

  # Junta os seis JSONs e calcula o escore de cada módulo e o geral. Falha se
  # algum módulo ficar abaixo de 50% (a meta vale para cada módulo crítico),
  # se faltar o JSON de algum ou se algum job de módulo não terminou bem
  # (quebrou, passou do tempo ou foi cancelado): um JSON parcial não vale.
  escore:
    needs: mutacao
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - uses: actions/download-artifact@v4
      with:
        pattern: mutacao-*
        path: backend/relatorios
    - name: Escore de mutação por módulo (mínimo 50%)
      run: >-
        python scripts/mutacao_incremental.py escore --minimo 50
        cadastro=relatorios/mutacao-cadastro/mutants/mutmut-cicd-stats.json
        cardapio/leitor=relatorios/mutacao-cardapio-leitor/mutants/mutmut-cicd-stats.json
        cardapio=relatorios/mutacao-cardapio/mutants/mutmut-cicd-stats.json
        avaliacao=relatorios/mutacao-avaliacao/mutants/mutmut-cicd-stats.json
        fila=relatorios/mutacao-fila/mutants/mutmut-cicd-stats.json
        gamificacao=relatorios/mutacao-gamificacao/mutants/mutmut-cicd-stats.json
    - name: Todos os módulos terminaram
      if: ${{ !cancelled() && needs.mutacao.result != 'success' }}
      env:
        RESULTADO: ${{ needs.mutacao.result }}
      run: |
        echo "::error::Algum job de módulo não terminou bem ($RESULTADO): o relatório está incompleto."
        exit 1
