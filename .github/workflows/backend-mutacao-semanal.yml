name: Backend mutação semanal

# Mutação na base inteira dos módulos críticos (BE-19, ADR 0013, decisão 6;
# Plano de Testes 5.4): pega o escore de quem não mexeu em módulo crítico
# recentemente, o que o job `mutacao` dos PRs não vê. É o relatório que a
# BE-18 anexa à issue.
#
# Separado do backend-ci.yml para não disparar lint, testes e testes-mysql
# toda semana sem motivo.
#
# O `schedule` e o `workflow_dispatch` só valem para o workflow que está na
# branch padrão do repositório (a `main`). Até a release levar este arquivo
# para a `main`, a rodada é disparada com um push para a branch
# `mutacao/base-inteira` (criada a partir da `develop`).
on:
  schedule:
    # Domingo às 06:00 UTC (03:00 em Brasília).
    - cron: "0 6 * * 0"
  workflow_dispatch:
  push:
    branches: [ "mutacao/base-inteira" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  # Um job por módulo crítico: a base inteira (5.240 mutantes, quase metade no
  # leitor) arrisca passar do limite de 6 horas de um job só.
  mutacao:
    name: mutacao (${{ matrix.modulo }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      # Um módulo abaixo da meta não interrompe os outros: o relatório sai
      # completo.
      fail-fast: false
      matrix:
        include:
          - modulo: cadastro
            artefato: cadastro
          - modulo: cardapio/leitor
            artefato: cardapio-leitor
          - modulo: cardapio
            artefato: cardapio
          - modulo: avaliacao
            artefato: avaliacao
          - modulo: fila
            artefato: fila
          - modulo: gamificacao
            artefato: gamificacao
    steps:
    - uses: actions/checkout@v5
      with:
        # Na rodada agendada, o workflow roda a partir da `main`, mas a base
        # que importa é a da `develop`, onde as mudanças entram primeiro. No
        # workflow_dispatch e no push, vale a branch escolhida.
        ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - run: pip install -r requirements-dev.txt

    # O cardápio sem o leitor é a lista dos arquivos: "apps.cardapio.*" também
    # casaria com o leitor.
    - name: Curingas do módulo
      env:
        MODULO: ${{ matrix.modulo }}
      run: |
        python scripts/mutacao_incremental.py modulo "$MODULO" > alvos.txt
        cat alvos.txt

    - name: Rodar o mutmut no módulo
      run: |
        set +e
        xargs -a alvos.txt mutmut run --max-children 4 > mutmut.log 2>&1
        codigo=$?
        set -e
        # Tira as linhas da barra de progresso e deixa só a última.
        tr '\r' '\n' < mutmut.log | awk '
          /^[^ ]+ [0-9]+\/[0-9]+  / { progresso = $0; next }
          /^[^ ]+ [A-Z][A-Za-z ]*$/ { next }
          NF { print }
          END { if (progresso) print "Progresso final: " progresso }' | tail -n 100
        if [ "$codigo" -ne 0 ]; then
          exit "$codigo"
        fi
        mutmut export-cicd-stats
        # Sobreviventes e sem teste (sem os "not checked", que ficaram fora
        # desta rodada).
        mutmut results | { grep -v ': not checked$' || true; } > mutmut-results.txt

    - name: Publicar o relatório do módulo
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: mutacao-${{ matrix.artefato }}
        path: |
          backend/mutmut.log
          backend/mutmut-results.txt
          backend/mutants/mutmut-cicd-stats.json
        if-no-files-found: ignore

  # Junta os seis JSONs e calcula o escore de cada módulo e o geral. Falha se
  # algum módulo ficar abaixo de 50% (a meta vale para cada módulo crítico) ou
  # se faltar o JSON de algum (job que quebrou ou passou do tempo).
  escore:
    needs: mutacao
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - uses: actions/download-artifact@v4
      with:
        pattern: mutacao-*
        path: backend/relatorios
    - name: Escore de mutação por módulo (mínimo 50%)
      run: >-
        python scripts/mutacao_incremental.py escore --minimo 50
        cadastro=relatorios/mutacao-cadastro/mutants/mutmut-cicd-stats.json
        cardapio/leitor=relatorios/mutacao-cardapio-leitor/mutants/mutmut-cicd-stats.json
        cardapio=relatorios/mutacao-cardapio/mutants/mutmut-cicd-stats.json
        avaliacao=relatorios/mutacao-avaliacao/mutants/mutmut-cicd-stats.json
        fila=relatorios/mutacao-fila/mutants/mutmut-cicd-stats.json
        gamificacao=relatorios/mutacao-gamificacao/mutants/mutmut-cicd-stats.json
