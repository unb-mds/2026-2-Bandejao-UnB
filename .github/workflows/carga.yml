name: Teste de carga

# BD-14 (#184), RNF01: 2.000 usuários, p95 <= 3 s no cardápio e na previsão.
# Roda à mão (Actions > Teste de carga > Run workflow) e no PR para a
# develop quando o próprio teste muda. Fica fora do push e do PR de release
# (develop -> main): leva uns 10 minutos em 4 runners e mede desempenho, não
# corretude, e o deploy só espera o Backend CI e o Frontend CI.
on:
  pull_request:
    branches: [ "develop" ]
    paths:
      - "backend/carga/**"
      - "backend/requirements-carga.txt"
      - ".github/workflows/carga.yml"
  workflow_dispatch:
    inputs:
      usuarios:
        description: "Usuários simultâneos de cada rodada (lista JSON)"
        default: "[500, 1000, 1500, 2000]"
      duracao:
        description: "Duração da carga (ex.: 5m)"
        default: "5m"

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Uma rodada por número de usuários, em runners separados: a de 2.000 é
    # a meta do RNF01; as outras mostram até onde a meta é cumprida.
    strategy:
      fail-fast: false
      matrix:
        usuarios: ${{ fromJSON(inputs.usuarios || '[500, 1000, 1500, 2000]') }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: senha-carga-descartavel
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: bandejao_carga
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    # Como em produção: sem DEBUG e com o MySQL. O SMTP é falso; nenhum dos
    # dois endpoints manda e-mail.
    env:
      DJANGO_SECRET_KEY: chave-exclusiva-da-carga
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_ENGINE: mysql
      DB_NAME: bandejao_carga
      DB_USER: root
      DB_PASSWORD: senha-carga-descartavel
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      URL_DO_PWA: http://localhost:5173
      EMAIL_HOST: smtp.teste.invalid
      EMAIL_HOST_USER: usuario-teste
      EMAIL_HOST_PASSWORD: senha-teste
      DEFAULT_FROM_EMAIL: nao-responda@bandejaounb.com.br
      USUARIOS: ${{ matrix.usuarios }}
      DURACAO: ${{ inputs.duracao || '5m' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-prod.txt
            backend/requirements-carga.txt

      - name: Instalar bibliotecas do MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Instalar dependências (produção e Locust)
        run: python -m pip install -r requirements-prod.txt -r requirements-carga.txt

      - name: Preparar o banco
        env:
          CARGA_CHECKINS: "200"
        run: |
          python manage.py migrate --noinput
          python manage.py loaddata campi marcadores
          python manage.py shell -c "from carga.dados import main; main()"

      # Os mesmos workers e timeout do entrypoint.sh (3 workers, 30 s), sem o
      # log de acesso, que pesaria no disco do runner com milhares de pedidos.
      - name: Subir o Gunicorn
        run: |
          gunicorn config.wsgi:application --bind 127.0.0.1:8000 \
            --workers 3 --timeout 30 --daemon --pid gunicorn.pid
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:8000/api/campi/" >/dev/null && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8000/api/cardapio/?campus=1" | grep -q '"publicado"'
          curl -fsS "http://127.0.0.1:8000/api/fila/previsao/?campus=1&refeicao=almoco" | grep -q '"disponivel"'

      - name: Rodar a carga
        run: |
          mkdir -p resultado
          locust -f carga/locustfile.py --headless \
            --host http://127.0.0.1:8000 \
            -u "$USUARIOS" -r 50 -t "$DURACAO" \
            --processes 2 --csv resultado/carga --only-summary \
            --exit-code-on-error 0

      - name: Avaliar contra a meta do RNF01
        run: |
          set -o pipefail
          {
            echo "## Teste de carga (BD-14)"
            echo
            echo "Por $DURACAO, com o Gunicorn em 3 workers e o MySQL 8.4 no runner do GitHub."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # Todas as rodadas são informativas no CI: o veredito do RNF01 (até
          # 2.000 usuários) fica no resumo do job e em
          # docs/qualidade/teste-de-carga-bd14.md, e não num X permanente no
          # PR. Para o código de saída do veredito, rode o carga.avaliar sem
          # o --informativo.
          python -m carga.avaliar resultado/carga_stats.csv --informativo | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-carga-${{ matrix.usuarios }}
          path: backend/resultado/
