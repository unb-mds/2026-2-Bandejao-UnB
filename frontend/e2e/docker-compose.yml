# Pilha dos testes de ponta a ponta (FE-18, Plano de Testes 3.5 e 5.3): o
# mesmo PWA (build de produção no Caddy), o mesmo backend (Gunicorn) e o
# mesmo MySQL de produção, mais um SMTP de teste (Mailpit) para ler o link de
# confirmação do cadastro.
#
# Diferenças para o docker-compose.yml da raiz (produção):
# - HTTP em localhost:8080, sem o certificado do Let's Encrypt (Caddyfile
#   desta pasta), e os cookies sem o flag Secure;
# - o relógio do backend começa numa segunda-feira, no almoço (libfaketime),
#   a cada subida do container, e anda dali em diante: o check-in só vale no
#   horário da refeição e a avaliação só depois que ela começa, e o CI roda a
#   qualquer hora. O globalSetup do Playwright recria o backend antes de cada
#   rodada, para o relógio voltar ao meio-dia;
# - o e-mail vai para o Mailpit, e não para o Brevo;
# - sem os scripts de db/init/ (o usuário da equipe não é usado nos testes).
#
# Uso (de dentro de frontend/): npm run e2e:subir, npm run e2e e
# npm run e2e:descer. Veja o README do front.

name: bandejao-e2e

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bandejao
      MYSQL_USER: bandejao
      MYSQL_PASSWORD: senha-do-banco-e2e
      MYSQL_ROOT_PASSWORD: senha-root-e2e
    volumes:
      # Charset e isolamento iguais aos de produção.
      - ../../db/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s

  mailpit:
    image: axllent/mailpit:v1.27.11
    environment:
      # O backend em produção sempre autentica no SMTP, sem TLS aqui.
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      # API e caixa de entrada (http://localhost:8025), lidas pelos testes.
      # Só na própria máquina: numa rede compartilhada (como a da UnB), a
      # caixa ficaria aberta a quem estivesse nela.
      - '127.0.0.1:8025:8025'

  # Baixa a libfaketime, que o backend carrega com LD_PRELOAD. Fica num
  # container à parte para a imagem do backend ser a mesma de produção. A
  # imagem do python:3.14-slim é Debian trixie, como esta. Imagem fixa pelo
  # digest e pacote na versão exata: uma versão nova do Debian não muda o
  # relógio dos testes sem passar por um PR. Se o Debian tirar esta versão do
  # repositório, o apt falha com a mensagem do pacote e é só atualizar aqui.
  #
  # Só baixa se a biblioteca ainda não estiver no volume: o Compose roda este
  # serviço de novo a cada `up`, e sobrescrever o arquivo que o backend tem
  # carregado o derruba (falha de segmentação). A cópia vai para um arquivo
  # temporário e é renomeada no fim. Depois de mudar a versão, rode
  # `npm run e2e:descer` para o volume ser recriado.
  relogio:
    image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    command:
      - sh
      - -c
      - >-
        test -f /relogio/libfaketime.so.1
        || (apt-get update -qq
        && apt-get install -y -qq --no-install-recommends
        libfaketime=0.9.10+2024-06-05+gba9ed5b2-0.6 > /dev/null
        && cp /usr/lib/*/faketime/libfaketime.so.1 /relogio/.libfaketime.tmp
        && mv /relogio/.libfaketime.tmp /relogio/libfaketime.so.1)
    volumes:
      - relogio:/relogio

  backend:
    build: ../../backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      relogio:
        condition: service_completed_successfully
    environment:
      DJANGO_SECRET_KEY: chave-so-dos-testes-de-ponta-a-ponta
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080
      URL_DO_PWA: http://localhost:8080
      # HTTP: sem o flag Secure nos cookies e sem ler o X-Forwarded-Proto. O
      # Caddy do e2e está na frente, mas com ATRAS_DE_PROXY_HTTPS=False o
      # NUM_PROXIES vira 0, e o limite de taxa conta todo pedido como o IP do
      # Caddy (por isso o globalSetup limpa o cache a cada rodada).
      ATRAS_DE_PROXY_HTTPS: 'False'
      SESSION_COOKIE_SECURE: 'False'
      CSRF_COOKIE_SECURE: 'False'
      SECURE_HSTS_SECONDS: '0'
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: bandejao
      DB_USER: bandejao
      DB_PASSWORD: senha-do-banco-e2e
      EMAIL_HOST: mailpit
      EMAIL_PORT: '1025'
      EMAIL_USE_TLS: 'False'
      EMAIL_HOST_USER: e2e
      EMAIL_HOST_PASSWORD: e2e
      DEFAULT_FROM_EMAIL: nao-responda@bandejaounb.com.br
      # Segunda-feira, 23/11/2026, 12h em Brasília (15h UTC), no almoço. O
      # relógio começa aí a cada subida do container e anda em tempo real; o
      # DONT_RESET vale o mesmo início para os workers do Gunicorn, que são
      # outros processos.
      LD_PRELOAD: /relogio/libfaketime.so.1
      FAKETIME: '@2026-11-23 15:00:00'
      FAKETIME_DONT_RESET: '1'
    volumes:
      - relogio:/relogio:ro
      # Fixtures dos testes (cardápio, contas e histórico da fila).
      - ./dados:/e2e-dados:ro
    healthcheck:
      # Pronto quando o Gunicorn aceita conexão e o relógio está no almoço de
      # 23/11 (11h às 14h30 de Brasília). O healthcheck herda o LD_PRELOAD:
      # se a libfaketime não carregou, a data é a de hoje e o backend não fica
      # saudável. Depois de 2h30 no ar, o relógio sai do almoço e o check
      # também falha, avisando que é hora de recriar o backend.
      test:
        - CMD
        - python
        - -c
        - >-
          import datetime as d, socket;
          socket.create_connection(("127.0.0.1", 8000), 2);
          utc = d.timezone.utc;
          agora = d.datetime.now(utc);
          assert d.datetime(2026, 11, 23, 14, 0, tzinfo=utc) <= agora < d.datetime(2026, 11, 23, 17, 30, tzinfo=utc), f"relógio fora do almoço de 23/11: {agora}"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s

  caddy:
    build: ..
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Só na própria máquina, como o Mailpit.
      - '127.0.0.1:8080:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      # O PWA (index.html) e a API respondem pelo Caddy.
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1/ && wget -qO /dev/null http://127.0.0.1/api/campi/']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  relogio:
