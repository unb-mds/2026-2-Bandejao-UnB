[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = apps tests
addopts = --import-mode=importlib
# SECRET_KEY não tem default no settings.py (de propósito). O prefixo D: só
# aplica o valor se a variável ainda não existir, então um .env ou um export
# de verdade continua valendo.
#
# O CI roda sem DEBUG (o padrão é False), e em produção o endereço do PWA e o
# SMTP também são obrigatórios. O backend de memória dispensa o SMTP (e o
# pytest-django já troca o MAILERS por ele nos testes).
env =
    D:SECRET_KEY=chave-so-para-teste
    D:URL_DO_PWA=http://localhost:5173
    D:EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
