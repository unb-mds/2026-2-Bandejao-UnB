[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = apps tests
addopts = --import-mode=importlib
# DJANGO_SECRET_KEY não tem default no settings.py (de propósito). O prefixo
# D: só aplica o valor se a variável ainda não existir no ambiente: um export
# continua valendo, mas o .env local não, porque o decouple prefere o ambiente
# ao arquivo.
#
# O CI roda sem DEBUG (o padrão é False), e em produção o
# DJANGO_ALLOWED_HOSTS, o endereço do PWA, o SMTP e o remetente também são
# obrigatórios, e só o backend SMTP é aceito. Os valores do SMTP são falsos:
# o pytest-django troca o MAILERS pelo backend de memória nos testes, e nada
# sai pela rede.
env =
    D:DJANGO_SECRET_KEY=chave-so-para-teste
    D:DJANGO_ALLOWED_HOSTS=localhost
    D:URL_DO_PWA=http://localhost:5173
    D:EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
    D:EMAIL_HOST=smtp.teste.invalid
    D:EMAIL_HOST_USER=usuario-teste
    D:EMAIL_HOST_PASSWORD=senha-teste
    D:DEFAULT_FROM_EMAIL=nao-responda@bandejaounb.com.br
