[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = apps tests
addopts = --import-mode=importlib
# SECRET_KEY não tem default no settings.py (de propósito). O prefixo D: só
# aplica o valor se a variável ainda não existir, então um .env ou um export
# de verdade continua valendo.
env =
    D:SECRET_KEY=chave-so-para-teste
