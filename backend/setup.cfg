# Mutação do backend (BE-19, ADR 0013). Módulos críticos do Plano de Testes,
# seção 2. Fora: testes, migrations e arquivos de registro do Django.
[mutmut]
source_paths=
    apps/
only_mutate=
    apps/cadastro/*
    apps/cardapio/*
    apps/avaliacao/*
    apps/fila/*
    apps/gamificacao/*
do_not_mutate=
    */tests/*
    */migrations/*
    */admin.py
    */apps.py
    */urls.py
# O mutmut roda os testes numa cópia (mutants/), que só leva o source_paths.
# O que mais os testes de apps/ precisam vai junto: config/ (o settings),
# conftest.py e pytest.ini (fixtures, DJANGO_SETTINGS_MODULE e variáveis de
# ambiente) e manage.py (o pytest-django põe a pasta dele no sys.path para
# achar o pacote config). Sem eles, o pytest-django não sobe.
also_copy=
    config/
    conftest.py
    pytest.ini
    manage.py
# Só os testes dos apps: os de backend/tests/ acham a raiz do repositório
# com Path(__file__).resolve().parents[2], que aponta para o lugar errado
# dentro de mutants/, e o mutmut aborta na fase "Running clean tests". São
# testes de configuração e deploy, que não matam mutantes dos módulos
# críticos (Plano de Testes, seção 5.1).
pytest_add_cli_args_test_selection=
    apps/
